name: Supabase keepalive
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep AnbarYar Supabase project active
        env:
          SUPABASE_URL: https://foyttvvpscenkxbobazs.supabase.co
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZveXR0dnZwc2Nlbmt4Ym9iYXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1ODM5ODAsImV4cCI6MjExMDE1OTk4MH0.Tjv-n3OinihjPAHh6AppQmrUbXudUC2QMXbcyISWlmo
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/rpc/anbaryar_keepalive" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
