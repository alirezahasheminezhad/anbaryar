name: Build AnbarYar index
on:
  push:
    branches: [feature/supabase-cloud-backups]
permissions:
  contents: write
concurrency:
  group: anbaryar-cloud-backup-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supabase-cloud-backups
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 build.py
      - name: Commit generated index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build generated AnbarYar index"
          git pull --rebase origin feature/supabase-cloud-backups
          git push
