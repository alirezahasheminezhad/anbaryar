name: Build generated AnbarYar index
on:
  push:
    branches: [main, feature/offline-cloud-sync-email]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anbaryar-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build generated index
        run: python3 build.py
      - name: Commit generated index when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches src/"
            exit 0
          fi
          git commit -m "Build generated AnbarYar index"
          git push origin HEAD:${GITHUB_REF_NAME}
