name: offline-build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build index.html from src
        run: python3 build.py
      - name: Build self-contained offline single file
        run: node tools/build-offline.js
      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: anbar-yar-offline
          path: dist/anbar-yar-offline.html
          retention-days: 90
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anbar-yar-offline.html
          name: ${{ github.ref_name }}