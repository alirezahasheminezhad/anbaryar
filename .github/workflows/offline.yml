name: offline-build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build index.html from src
        run: python3 build.py
      - name: Build self-contained offline single file
        run: node tools/build-offline.js
      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: anbar-yar-offline
          path: dist/anbar-yar-offline.html
          retention-days: 90
      - name: Publish offline file to Releases (rolling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view offline-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create offline-latest --repo "$GITHUB_REPOSITORY" \
              --title "نسخه آفلاین (همیشه آخرین)" \
              --notes "خروجی خودکار ساخت آفلاین تک‌فایلی؛ با هر push به main به‌روز می‌شود. فایل را دانلود و با دو بار کلیک اجرا کنید." \
              --target "$GITHUB_SHA"
          gh release upload offline-latest dist/anbar-yar-offline.html --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anbar-yar-offline.html
          name: ${{ github.ref_name }}