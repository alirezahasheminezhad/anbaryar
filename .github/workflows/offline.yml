name: offline-build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build index.html from src
        run: python3 build.py
      - name: Build self-contained offline single file
        run: node tools/build-offline.js
      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: anbar-yar-offline
          path: dist/anbar-yar-offline.html
          retention-days: 90
      # هر push روی main یک Release جدید می‌سازد؛ قبلی‌ها می‌مانند. نسخه = APP_BUILD + شماره‌ی اجرا (همیشه صعودی)
      - name: Publish new versioned Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUILD=$(grep -oP "const APP_BUILD = '\K[0-9]+(\.[0-9]+)*" src/app/05-storage-security.jsx)
          TAG="v$BUILD.$GITHUB_RUN_NUMBER"
          FILE="dist/anbar-yar-offline-$TAG.html"
          cp dist/anbar-yar-offline.html "$FILE"
          # اجرای دوباره‌ی همان run: Release موجود است و فقط فایلش جایگزین می‌شود
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "انبار یار $TAG (آفلاین)" \
              --notes "$(git log -1 --format=%B)"
          fi
