<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>انبار یار - Pro Mahak Sync v7</title>
    
    <!-- کتابخانه‌های ضروری -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // --- هویت بصری اختصاصی "انبار یار" -----------------------------------------
      // به‌جای رنگ ژنریک indigo پیش‌فرض Tailwind (که در سراسر برنامه برای برند/دکمه‌های
      // اصلی/حالت فعال استفاده شده)، یک آبی-سرمه‌ای عمیق و حرفه‌ای («دفتر کل/انبار»)
      // جایگزین می‌شود؛ چون این جایگزینی روی خودِ نام رنگ indigo انجام می‌شود، هیچ
      // className‌ای در کامپوننت‌ها تغییر نمی‌کند و منطق برنامه دست‌نخورده می‌ماند.
      // رنگ brass (برنز/طلایی کدر = لهجه‌ی نارنجیِ اسکرین‌شات مرجع) هم به‌عنوان لهجه‌ی
      // امضادار، فقط در چند نقطه‌ی محدود (نشان/هدر ساید‌بار/دکمه‌های CTA) استفاده می‌شود.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Vazirmatn', 'sans-serif']
            },
            colors: {
              indigo: {
                50:'#eef3ff', 100:'#e0e9ff', 200:'#c4d4fd', 300:'#9bb6fa', 400:'#6b91f5',
                500:'#3a6df0', 600:'#1d5eea', 700:'#1749c2', 800:'#1a2a6c', 900:'#14214f', 950:'#0d1536'
              },
              brass: {
                50:'#fef4ec', 100:'#fde9d9', 200:'#fad1b2', 300:'#f8b381', 400:'#f88f49',
                500:'#f47125', 600:'#e25812', 700:'#b84514', 800:'#8c3817', 900:'#652b15', 950:'#39190e'
              },
              // فقط سه پله‌ی روشن slate (که تقریباً همیشه پس‌زمینه/خط‌دور هستند، نه متن) کمی
              // نرم‌تر و هم‌رنگ‌تر با هویت سرمه‌ای می‌شوند؛ پله‌های ۳۰۰ به بعد (که برای متن هم
              // استفاده می‌شوند) دست‌نخورده باقی می‌مانند تا هیچ خوانایی متنی آسیب نبیند.
              slate: { 50:'#f5f8fc', 100:'#eef2f8', 200:'#e1e8f2', 400:'#6b7a94' } /* 400 تیره‌تر شد: کنتراست ۴:۱ برای برچسب‌های ریز */
            },
            borderRadius: {
              lg: '0.625rem', xl: '0.875rem', '2xl': '1.125rem', '3xl': '1.75rem'
            },
            boxShadow: {
              sm: '0 1px 2px 0 rgba(20,33,79,0.06)',
              DEFAULT: '0 1px 3px 0 rgba(20,33,79,0.08), 0 1px 2px -1px rgba(20,33,79,0.06)',
              md: '0 4px 8px -2px rgba(20,33,79,0.08), 0 2px 4px -2px rgba(20,33,79,0.05)',
              lg: '0 12px 20px -6px rgba(20,33,79,0.10), 0 4px 8px -4px rgba(20,33,79,0.06)',
              xl: '0 22px 32px -8px rgba(20,33,79,0.12), 0 8px 12px -6px rgba(20,33,79,0.06)',
              '2xl': '0 30px 60px -15px rgba(20,33,79,0.20)'
            }
          }
        }
      };
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

      // کاربر برنامه باید کاملاً آفلاین و بدون وابستگی به اینترنت بین‌المللی کار کند؛ همین متغیر برای
      // پنجره‌ی چاپ/PDF هم دوباره استفاده می‌شود تا فونت آنجا هم دقیقاً یکسان و بدون تاخیر شبکه باشد.
